openapi: 3.0.3
info:
  title: PriVis Track API
  version: 1.0.0-draft
  description: |
    Kontrak REST API untuk PriVis Track (Fase 2). Masih draft untuk review —
    belum diimplementasikan. Auth memakai Bearer JWT; semua waktu ISO-8601 UTC;
    field memakai snake_case agar selaras dengan DTO Freezed di aplikasi Flutter.
  contact:
    name: PriVis Track Team
servers:
  - url: http://localhost:3000/v1
    description: Development
  - url: https://privis.briczz.my.id/v1
    description: Production (Cloudflare Tunnel → Nginx Proxy Manager)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Projects
  - name: Documents
  - name: Users
  - name: Activities
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check untuk Docker/load balancer
      security: []
      responses:
        '200':
          description: Layanan sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user internal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi access token dengan refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token baru diterbitkan (refresh token lama dicabut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logout berhasil
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Ubah password user yang sedang login
      description: |
        Memverifikasi password saat ini lalu mengganti hash password.
        Semua refresh token lama dicabut; respons berisi token baru agar
        perangkat ini tetap login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password diubah dan token baru diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Auth]
      summary: Profil user yang sedang login
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Daftar user internal (admin)
      responses:
        '200':
          description: Daftar user, aktif lebih dulu lalu nama
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Tambah user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user_id}:
    patch:
      tags: [Users]
      summary: Ubah user (admin)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user_id}/reset-password:
    post:
      tags: [Users]
      summary: Reset password user (admin)
      description: |
        Mengganti password user lain dan mencabut seluruh sesi user tersebut.
        Untuk akun sendiri gunakan /auth/change-password.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '204':
          description: Password direset dan sesi user dicabut
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Agregat dashboard (portfolio, proyek berjalan, aktivitas terbaru)
      responses:
        '200':
          description: Data dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      summary: Daftar semua proyek dengan filter & pagination
      parameters:
        - $ref: '#/components/parameters/ProjectStatusFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: Urutan, contoh `updated_at:desc` atau `due_date:asc`
          schema:
            type: string
            default: updated_at:desc
      responses:
        '200':
          description: Daftar proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{project_code}:
    get:
      tags: [Projects]
      summary: Detail proyek + kontak klien + 8 tahap (dokumen di-embed)
      parameters:
        - $ref: '#/components/parameters/ProjectCode'
      responses:
        '200':
          description: Detail proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Ubah status / tahap aktif / due date proyek (pm/admin)
      parameters:
        - $ref: '#/components/parameters/ProjectCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Proyek terbaru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_code}/stages/{stage_no}:
    patch:
      tags: [Projects]
      summary: Ubah status selesai sebuah tahap (tanpa validasi urutan)
      parameters:
        - $ref: '#/components/parameters/ProjectCode'
        - $ref: '#/components/parameters/StageNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageUpdateRequest'
      responses:
        '200':
          description: Tahap terbaru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_code}/stages/{stage_no}/documents:
    get:
      tags: [Documents]
      summary: Daftar dokumen pada satu tahap
      parameters:
        - $ref: '#/components/parameters/ProjectCode'
        - $ref: '#/components/parameters/StageNo'
      responses:
        '200':
          description: Daftar dokumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Documents]
      summary: Unggah dokumen ke sebuah tahap
      parameters:
        - $ref: '#/components/parameters/ProjectCode'
        - $ref: '#/components/parameters/StageNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Maksimum 20 MB (env MAX_UPLOAD_MB)
                name:
                  type: string
                  description: Nama tampilan, default nama file asli
      responses:
        '201':
          description: Dokumen tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'

  /documents/{document_id}/download:
    get:
      tags: [Documents]
      summary: Unduh dokumen (binary stream via API)
      description: |
        MinIO tidak diekspos ke publik. API mengalirkan file langsung dengan
        Content-Disposition. Mendukung Range request (206) bila diimplementasikan.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: File binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename*=UTF-8''nama-file
            Content-Length:
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{document_id}:
    delete:
      tags: [Documents]
      summary: Hapus dokumen (soft delete) — admin/pm
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Dokumen dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities:
    get:
      tags: [Activities]
      summary: Feed aktivitas tim dengan cursor pagination
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Nilai `next_cursor` dari respons sebelumnya
          schema:
            type: string
      responses:
        '200':
          description: Daftar aktivitas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectCode:
      name: project_code
      in: path
      required: true
      description: Kode proyek yang mudah dibaca (contoh PRJ-001)
      schema:
        type: string
        pattern: '^PRJ-[0-9]{3}$'
        example: PRJ-001
    StageNo:
      name: stage_no
      in: path
      required: true
      description: Nomor tahap SDLC 1..8
      schema:
        type: integer
        minimum: 1
        maximum: 8
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectStatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ProjectStatus'
    Search:
      name: search
      in: query
      description: Cari pada nama proyek atau kode
      schema:
        type: string
        maxLength: 100
    ClientId:
      name: client_id
      in: query
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Kunci idempotensi untuk retry upload (disarankan UUID)
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequest:
      description: Permintaan tidak bisa diproses (mis. password saat ini salah)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: Password saat ini salah.
    Unauthorized:
      description: Token tidak ada atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Sesi berakhir, silakan login kembali.
    Forbidden:
      description: Role tidak punya akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: Anda tidak punya akses untuk aksi ini.
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Proyek tidak ditemukan.
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: Ukuran file melebihi batas.
              details:
                max_mb: 20
    Conflict:
      description: Konflik data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: Kode proyek sudah dipakai.
    RateLimited:
      description: Terlalu banyak permintaan
      headers:
        Retry-After:
          schema:
            type: integer
          description: Detik sampai boleh mencoba lagi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Terlalu banyak percobaan, coba lagi nanti.
    PayloadTooLarge:
      description: Ukuran file melebihi batas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: payload_too_large
              message: Ukuran file melebihi batas.
              details:
                max_mb: 20
    UnsupportedMediaType:
      description: MIME/ekstensi file tidak diizinkan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unsupported_media_type
              message: Tipe file tidak didukung.
    InternalError:
      description: Kesalahan server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: Terjadi kesalahan pada server.

  schemas:
    ProjectStatus:
      type: string
      enum: [not_started, in_progress, on_hold, completed]

    DocumentType:
      type: string
      enum: [pdf, spreadsheet, image, design, document, other]

    UserRole:
      type: string
      enum: [admin, pm, developer, qa, finance]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Ukuran file melebihi batas.
            details:
              type: object
              additionalProperties: true
              nullable: true
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [field, message]
                    properties:
                      field:
                        type: string
                      message:
                        type: string
            request_id:
              type: string
              example: 01J8Z9V6K3Q7M2T4R5X1N8B0C2

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: rina@privis.id
        password:
          type: string
          format: password
          minLength: 8

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rina
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        division:
          type: string
          nullable: true
          example: PM

    ManagedUser:
      type: object
      required: [id, name, email, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rina
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        division:
          type: string
          nullable: true
          example: PM
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          $ref: '#/components/schemas/UserRole'
        division:
          type: string
          maxLength: 100

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/UserRole'
        division:
          type: string
          nullable: true
          maxLength: 100
        is_active:
          type: boolean

    ResetUserPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        division:
          type: string
          nullable: true

    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/User'

    ClientSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: PT. ABC Retail

    ClientInfo:
      type: object
      required: [id, name, address, contact_name, contact_role, phone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: PT. ABC Retail
        address:
          type: string
          example: Jl. Jenderal Sudirman Kav. 52-53, Jakarta Selatan 12190
        contact_name:
          type: string
          example: Dewi Lestari
        contact_role:
          type: string
          example: IT Manager
        phone:
          type: string
          example: '+62 812-3456-7890'

    ProjectSummary:
      type: object
      required:
        [id, code, name, client, status, current_stage, current_stage_title, completed_stages, progress_percent, document_count, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^PRJ-[0-9]{3}$'
          example: PRJ-001
        name:
          type: string
          example: E-Commerce App
        client:
          $ref: '#/components/schemas/ClientSummary'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        current_stage:
          type: integer
          minimum: 0
          maximum: 8
          description: 0 jika belum mulai; nomor tahap belum selesai terkecil (8 jika semua selesai)
          example: 4
        current_stage_title:
          type: string
          example: Development
        completed_stages:
          type: integer
          minimum: 0
          maximum: 8
          example: 3
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: round(completed_stages / 8 * 100)
          example: 38
        document_count:
          type: integer
          example: 7
        due_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-20'
        updated_at:
          type: string
          format: date-time

    StageDocument:
      type: object
      required:
        [id, name, type, mime_type, size_bytes, uploaded_by, uploaded_at]
      properties:
        id:
          type: string
        name:
          type: string
          example: MoM Kickoff.pdf
        type:
          $ref: '#/components/schemas/DocumentType'
        mime_type:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
          example: 245760
        uploaded_by:
          $ref: '#/components/schemas/UserRef'
        uploaded_at:
          type: string
          format: date-time

    ProjectStage:
      type: object
      required: [stage_no, title, is_completed, document_count]
      properties:
        stage_no:
          type: integer
          minimum: 1
          maximum: 8
        title:
          type: string
          example: Discovery & Brief
        is_completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        document_count:
          type: integer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/StageDocument'

    ProjectDetail:
      type: object
      required:
        [id, code, name, client, status, current_stage, current_stage_title, completed_stages, progress_percent, stages, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^PRJ-[0-9]{3}$'
          example: PRJ-001
        name:
          type: string
        client:
          $ref: '#/components/schemas/ClientInfo'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        current_stage:
          type: integer
          minimum: 0
          maximum: 8
        current_stage_title:
          type: string
        completed_stages:
          type: integer
          minimum: 0
          maximum: 8
          example: 3
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 38
        stages:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ProjectStage'
        updated_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 8
        total_pages:
          type: integer
          example: 1

    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DocumentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StageDocument'

    PortfolioSlice:
      type: object
      required: [status, count, percentage]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        count:
          type: integer
          example: 4
        percentage:
          type: number
          format: float
          example: 50

    ProjectRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    ActivityType:
      type: string
      enum:
        - project_created
        - project_updated
        - stage_completed
        - stage_reopened
        - document_uploaded
        - document_deleted

    Activity:
      type: object
      required: [id, type, actor, action, target, project, created_at]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ActivityType'
        actor:
          $ref: '#/components/schemas/UserRef'
        action:
          type: string
          example: mengunggah
        target:
          type: string
          example: BAST 1
        project:
          $ref: '#/components/schemas/ProjectRef'
        created_at:
          type: string
          format: date-time

    ActivityListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        next_cursor:
          type: string
          nullable: true

    DashboardResponse:
      type: object
      required:
        [generated_at, total_projects, portfolio, active_projects, activities]
      properties:
        generated_at:
          type: string
          format: date-time
        total_projects:
          type: integer
          example: 8
        portfolio:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioSlice'
        active_projects:
          type: array
          description: Maksimum 10, urut due_date terdekat
          items:
            $ref: '#/components/schemas/ProjectSummary'
        activities:
          type: array
          description: Maksimum 10 aktivitas terbaru
          items:
            $ref: '#/components/schemas/Activity'

    ProjectUpdateRequest:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        current_stage:
          type: integer
          minimum: 0
          maximum: 8
        due_date:
          type: string
          format: date
          nullable: true

    StageUpdateRequest:
      type: object
      required: [is_completed]
      properties:
        is_completed:
          type: boolean

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
